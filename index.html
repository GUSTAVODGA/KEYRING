<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231F4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keyring">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Keyring</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F3F8;--surface:#FFFFFF;--surface-2:#ECEAF3;--ink:#1D1B33;--ink-2:#55536E;--ink-3:#8B89A3;--line:#E4E2EE;
  --hero:#231F4D;--hero-2:#2F2A63;--hero-ink:#FFFFFF;--hero-mute:#B5B0E6;
  --money:#12A36B;--money-soft:#E2F5EC;--due:#D98E04;--due-soft:#FFF3D6;--late:#E5484D;--late-soft:#FDE8E9;
  --promise:#7C5CFF;--promise-soft:#EEE9FF;--wa:#1FAF5B;--wa-ink:#fff;
  --shadow:0 1px 2px rgba(29,27,51,.06),0 6px 18px -10px rgba(29,27,51,.18);
  --f-display:'Bricolage Grotesque',ui-rounded,-apple-system,system-ui,sans-serif;
  --f-body:'Figtree',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12111C;--surface:#1C1A2B;--surface-2:#262438;--ink:#EEEDF7;--ink-2:#B4B2C9;--ink-3:#7F7D96;--line:#2E2C44;
  --hero:#2A2560;--hero-2:#363078;--hero-mute:#A9A3E0;
  --money:#3CCB8F;--money-soft:#163027;--due:#F2B33D;--due-soft:#33280F;--late:#FF6B6F;--late-soft:#3A1C20;
  --promise:#A08BFF;--promise-soft:#2A2248;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--promise);outline-offset:2px;border-radius:10px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + var(--safe-t)) 16px 24px}

/* ---------- Cabeçalho de página ---------- */
.pagehead{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
.pagehead h1{font:700 30px/1.05 var(--f-display);letter-spacing:-.025em;margin:0;flex:1}
.pagehead .sub{display:block;font:500 14px var(--f-body);color:var(--ink-3);letter-spacing:0;margin-bottom:2px}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex-shrink:0}
.iconbtn svg{width:20px;height:20px}
.backbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}

/* ---------- Herói da semana ---------- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:18px 18px 14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--hero-2);opacity:.7;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hero-range{font:600 15px var(--f-display);color:var(--hero-mute)}
.hero-range b{color:#fff;font-weight:700}
.hero-nav{display:flex;gap:6px}
.hero-nav button{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.hero-nav svg{width:18px;height:18px}
.hero-body{display:flex;align-items:center;gap:18px}
.ring{width:124px;height:124px;flex-shrink:0;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.12)}
.ring .fill{stroke:#5BE3A8;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .late{stroke:#FF8A8D;stroke-linecap:round}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-center b{font:800 28px/1 var(--f-display);letter-spacing:-.03em}
.ring-center small{display:block;font-size:12px;color:var(--hero-mute);margin-top:3px}
.hero-figs{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.fig-main span{font-size:13px;color:var(--hero-mute)}
.fig-main b{display:block;font:700 30px/1.05 var(--f-display);letter-spacing:-.025em;white-space:nowrap}
.fig-main i{font-style:normal;font-size:13px;color:var(--hero-mute)}
.fig-pills{display:flex;flex-wrap:wrap;gap:6px}
.fpill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-weight:600;font-size:13px;background:rgba(255,255,255,.1);white-space:nowrap}
.fpill .d{width:7px;height:7px;border-radius:50%}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:14px;color:var(--hero-mute);min-height:66px}
.day .wd{font-size:11px;font-weight:600}
.day .dn{font:700 17px/1 var(--f-display);color:#fff}
.day .dots{display:flex;gap:3px;height:7px;flex-wrap:wrap;justify-content:center;max-width:34px}
.day .dots i{width:6px;height:6px;border-radius:50%;display:block}
.day.today .dn{background:rgba(255,255,255,.16);border-radius:9px;padding:3px 6px;margin:-3px 0}
.day.sel{background:#fff;color:var(--ink-3)}
.day.sel .dn{color:var(--hero);background:none}
.day:disabled{opacity:.45;cursor:default}

/* ---------- Seções ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 4px 10px}
.sec h2{font:700 19px var(--f-display);letter-spacing:-.015em;margin:0}
.sec .aside{font-size:14px;color:var(--ink-3);font-weight:600}
.sec.late h2,.sec.late .aside{color:var(--late)}
.filterchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}

/* ---------- Cartão de cobrança ---------- */
.ch{background:var(--surface);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ch::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
.ch.k-late::before{background:var(--late)}.ch.k-today::before{background:var(--due)}.ch.k-promise::before{background:var(--promise)}.ch.k-paid::before{background:var(--money)}
.ch-main{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:700 15px var(--f-display);color:#fff;flex-shrink:0;letter-spacing:-.02em}
.av.lg{width:64px;height:64px;border-radius:20px;font-size:23px}
.av.sm{width:30px;height:30px;border-radius:10px;font-size:12px}
.ch-who{flex:1;min-width:0}
.ch-who b{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tok i{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
.when{display:block;font-size:13px;font-weight:600;margin-top:2px;color:var(--ink-3)}
.when.late{color:var(--late)}.when.today{color:var(--due)}.when.promise{color:var(--promise)}.when.paid{color:var(--money)}
.ch-amt{text-align:right;flex-shrink:0}
.ch-amt b{display:block;font:700 21px/1.1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.ch-amt b.late{color:var(--late)}
.bar{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden;width:86px;margin:6px 0 3px auto}
.bar i{display:block;height:100%;background:var(--money);border-radius:5px}
.ch-amt small{font-size:12px;color:var(--ink-3);white-space:nowrap}
.ch-act{display:flex;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.btn svg{width:19px;height:19px;flex-shrink:0}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.block{width:100%}.btn.grow{flex:1}
.btn[disabled]{opacity:.55}
.ch.compact{padding:10px 14px}
.ch.compact .ch-amt b{font-size:17px;color:var(--money)}
.ch.compact .av{width:34px;height:34px;border-radius:11px;font-size:13px}
.ch.dashed{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.ch.dashed::before{display:none}

/* ---------- Contas ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:2px;margin-bottom:14px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button em{font-style:normal;color:var(--ink-3);font-weight:500;margin-left:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column}
.tile-band{padding:10px 12px 34px;color:#fff;position:relative}
.tile-band small{font-weight:700;font-size:12px;opacity:.92}
.tile-band .plate{position:absolute;left:12px;bottom:-16px;background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 9px;font:800 19px/1 var(--f-display);letter-spacing:.01em;box-shadow:var(--shadow)}
.tile-body{padding:24px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.tile-body .reg{font-size:12px;color:var(--ink-3)}
.tile-user{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0}
.tile-user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.st.livre{background:var(--money-soft);color:var(--money)}.st.alugada{background:var(--promise-soft);color:var(--promise)}.st.pausada{background:var(--surface-2);color:var(--ink-3)}
.st.late{background:var(--late-soft);color:var(--late)}.st.due{background:var(--due-soft);color:var(--due)}.st.paid{background:var(--money-soft);color:var(--money)}
.st.aguardando{background:var(--due-soft);color:var(--due)}.st.recebido{background:var(--promise-soft);color:var(--promise)}.st.repassado{background:var(--money-soft);color:var(--money)}
.tile.add{border:2px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;min-height:170px;color:var(--ink-3);font-weight:700;gap:8px}
.tile.add svg{width:28px;height:28px}

/* ---------- Páginas de detalhe ---------- */
.panel{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h3{font:700 17px var(--f-display);margin:0 0 12px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 small{font:600 13px var(--f-body);color:var(--ink-3)}
.bandhead{border-radius:26px;padding:18px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden}
.bandhead .plate-xl{font:800 44px/1 var(--f-display);letter-spacing:-.01em;margin:6px 0 4px}
.bandhead .meta{opacity:.9;font-size:14px}
.bandhead .st{background:rgba(255,255,255,.22);color:#fff}
.rowline{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.rowline:first-of-type{border-top:0}
.rowline .grow{flex:1;min-width:0}
.rowline b{font-weight:700}
.rowline small{display:block;color:var(--ink-3);font-size:13px}
.rowline .r{text-align:right;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv span{display:block;font-size:13px;color:var(--ink-3)}
.kv b{font:700 18px var(--f-display);letter-spacing:-.01em}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl{position:relative;padding:8px 0}
.tl::before{content:"";position:absolute;left:-20px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 3px var(--ink-3)}
.tl.money::before{box-shadow:inset 0 0 0 3px var(--money)}.tl.late::before{box-shadow:inset 0 0 0 3px var(--late)}.tl.now::before{background:var(--promise);box-shadow:none}
.tl .row1{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.tl small{color:var(--ink-3);font-size:13px}
.clienthero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.clienthero h2{font:700 25px/1.1 var(--f-display);margin:0;letter-spacing:-.02em}
.clienthero .ph{color:var(--ink-3);font-size:14px}
.bigbal{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 14px}
.bigbal span{font-size:13px;color:var(--ink-3)}
.bigbal b{display:block;font:800 36px/1 var(--f-display);letter-spacing:-.03em}
.bigbal b.late{color:var(--late)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini{background:var(--surface-2);border-radius:14px;padding:10px}
.mini span{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
.mini b{font:700 16px var(--f-display);white-space:nowrap}
.empty{text-align:center;color:var(--ink-3);padding:28px 16px}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font:700 17px var(--f-display);margin-bottom:4px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--ink-3)}
.search input{border:0;background:transparent;box-shadow:none;padding:12px 0;min-height:0}
.search input:focus{outline:none}
.crow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);width:100%;text-align:left}
.crow .grow{flex:1;min-width:0}
.crow b{display:block;font-weight:700}
.crow .accs{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.crow .r{text-align:right}
.crow .r b{font:700 18px var(--f-display);white-space:nowrap}
.crow .r b.late{color:var(--late)}
.crow .r b.ok{color:var(--money);font-size:14px;font-family:var(--f-body)}

/* ---------- Bônus ---------- */
.split{display:flex;height:12px;border-radius:12px;overflow:hidden;margin:10px 0 6px;background:var(--surface-2)}
.split i{display:block;height:100%}
.split .c{background:var(--promise)}.split .m{background:var(--money)}
.splitlegend{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.splitlegend b{font-family:var(--f-display);color:var(--ink)}
.steps{display:flex;align-items:center;margin:14px 0 4px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-3);flex:0 0 auto;width:78px}
.step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);font-style:normal}
.step i svg{width:15px;height:15px}
.step.is-done{color:var(--ink)}.step.is-done i{background:var(--money);color:#fff}
.step.cur i{background:var(--promise);color:#fff}
.stepline{flex:1;height:3px;border-radius:3px;background:var(--surface-2);margin-bottom:18px}
.stepline.is-fill{background:var(--money)}
.usage{border-radius:14px;padding:10px 12px;font-size:14px;background:var(--surface-2)}
.usage.warn{background:var(--due-soft);color:var(--ink)}
.usage.bad{background:var(--late-soft)}

/* ---------- Barra inferior ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + var(--safe-b));pointer-events:none}
.tabbar-in{max-width:520px;margin:0 auto;background:var(--surface);border-radius:24px;box-shadow:0 10px 30px -10px rgba(29,27,51,.35),0 0 0 1px var(--line);display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;height:66px;pointer-events:auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-3);padding:6px 0}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--ink)}
.tab .pip{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
.tab.on .pip{background:var(--promise)}
.fab{width:56px;height:56px;border-radius:19px;background:var(--hero);color:#fff;display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 10px 22px -8px rgba(35,31,77,.7);transition:transform .2s}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.94)}

/* ---------- Folhas (bottom sheets) ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,16,36,.42);z-index:40;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 16px calc(22px + var(--safe-b));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.85,.25,1)}
.sheet.on{transform:none}
.sheet-in{max-width:560px;margin:0 auto}
.grab{display:block;width:100%;padding:6px 0 10px}
.grab i{display:block;width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.sheet h2{font:700 23px/1.15 var(--f-display);letter-spacing:-.02em;margin:0 0 4px}
.sheet .lead{color:var(--ink-2);margin:0 0 16px;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;font-weight:700;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:12.5px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:0;border-radius:14px;padding:13px 14px;width:100%;min-height:50px;box-shadow:inset 0 0 0 1.5px var(--line);-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--promise)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money-in{display:flex;align-items:baseline;gap:6px;background:var(--surface);border-radius:20px;padding:14px 18px;box-shadow:inset 0 0 0 1.5px var(--line)}
.money-in:focus-within{box-shadow:inset 0 0 0 2px var(--promise)}
.money-in span{font:700 22px var(--f-display);color:var(--ink-3)}

  else if (op === 'update') S[col].set(id, Object.assign({}, S[col].get(id) || {}, data));
  else S[col].delete(id);
  if (mode === 'local') { lsSave(); schedule(); return; }
  var ref = db.collection(col).doc(id);
  if (mode === 'firebase') {
    var p = op === 'set' ? ref.set(data) : op === 'update' ? ref.update(data) : ref.delete();
    p.catch(function (e) { console.error(e); toast(e && e.code === 'permission-denied' ? 'Sem permissão para salvar. Entre de novo.' : 'Não consegui salvar na nuvem. Tente de novo.', true); });
    schedule(); return;
  }
  var run = function () { return op === 'set' ? ref.set(data) : op === 'update' ? ref.update(data) : ref.delete(); };
  try { await run(); } catch (e) {
    if (e && e.code === 'unavailable') { await new Promise(function (r) { setTimeout(r, 500 + Math.random() * 600); }); await run(); return; }
    throw e;
  }
  schedule();
}

// Gera as cobranças até o fim da semana atual. O id do documento é vínculo + vencimento:
// abrir de novo, atualizar ou usar em dois aparelhos nunca cria cobrança repetida.
var generating = false;
async function generate() {
  if (generating || !ready) return;
  generating = true;
  try {
    var horizon = weekEnd(today), todo = [];
    list('rentals').forEach(function (r) {
      if (r.firstDueDate > horizon) return;
      dueDates(r, r.endDate && r.endDate < horizon ? r.endDate : horizon).forEach(function (d) {
        var id = chargeId(r.id, d);
        if (!S.charges.has(id)) { var amt = rateFor(r, d); if (amt) todo.push([id, {rentalId: r.id, clientId: r.clientId, accountId: r.accountId, dueDate: d, amountCents: amt, promiseDate: null, promiseNote: '', cancelledAt: null, cancelReason: '', createdAt: nowIso()}]); }
      });
    });
    for (var i = 0; i < todo.length; i++) await write('set', 'charges', todo[i][0], todo[i][1]);
  } catch (e) { toast('Não consegui gerar as cobranças da semana.', true); }
  finally { generating = false; }
}

async function onAction(el) {
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
  switch (act) {
    case 'tab': return tab(v);
    case 'back': return back();
    case 'fab': return fabSheet();
    case 'closeSheet': return closeSheet();
    case 'settings': return settingsSheet();
    case 'week': view.w = v; view.day = null; animateRing = true; return render();
    case 'day': view.day = view.day === v ? null : v; return render();
    case 'scrollLate': var ls = document.getElementById('lateSec'); if (ls) ls.scrollIntoView({behavior: 'smooth', block: 'start'}); return;
    case 'charge': return chargeSheet(id);
    case 'pay': return paySheet(id);
    case 'pickPay': return pickPaySheet();
    case 'client': closeSheet(); return go({tab: 'clientes', page: 'cliente', id: id});
    case 'account': closeSheet(); return go({tab: 'contas', page: 'conta', id: id});
    case 'bonus': closeSheet(); return go({tab: 'painel', page: 'bonus', id: id});
    case 'goBonus': return go({tab: 'painel', page: 'bonusList'});
    case 'goClients': return tab('clientes');
    case 'goFree': tab('contas'); view.filter = 'livre'; return render();
    case 'accFilter': view.filter = v; return render();
    case 'subFilter': view.filter = v; return render();
    case 'allHist': view.allHist = true; return render();
    case 'newClient': return clientSheet(null);
    case 'newClientFor': return clientSheet(null, id);
    case 'editClient': return clientSheet(id);
    case 'newAccount': return accountSheet(null);
    case 'editAccount': return accountSheet(id);
    case 'adjust': return adjustSheet(id);
    case 'endRental': return endSheet(id);
    case 'cancelCharge': return cancelSheet(id);
    case 'newSub': return subSheet({accountId: el.getAttribute('data-account') || '', clientId: el.getAttribute('data-client') || ''});
    case 'editSub': return subSheet(get('subsidies', id));
    case 'editPay': sheet.editPay = id || null; sheet.dirty = false; return paintSheet();
    case 'delPay':
      if (!(await ask('Excluir este pagamento?', 'Excluir', true))) return;
      await write('delete', 'payments', id); sheet.editPay = null; paintSheet(); return toast('Pagamento excluído. Saldo atualizado.');
    case 'clearPromise': await write('update', 'charges', id, {promiseDate: null, promiseNote: ''}); paintSheet(); return toast('Promessa removida.');
    case 'reactivate': await write('update', 'charges', id, {cancelledAt: null, cancelReason: ''}); paintSheet(); return toast('Cobrança reativada.');
    case 'pause':
      var a = get('accounts', id); if (activeRental(id)) throw new UErr('Encerre o aluguel antes de pausar.');
      await write('update', 'accounts', id, {paused: !a.paused}); closeSheet(); return toast(a.paused ? 'Conta reativada.' : 'Conta pausada.');
    case 'subStatus':
      var s = get('subsidies', id), patch = {status: v};
      if (v === 'recebido' && !s.receivedCents) { subSheet(Object.assign({}, s, {status: 'recebido'})); return toast('Informe quanto a plataforma pagou.'); }
      if (v !== 'aguardando' && !s.receivedOn) patch.receivedOn = today;
      if (v === 'repassado' && !s.passedOn) patch.passedOn = today;
      await write('update', 'subsidies', id, patch); return toast(v === 'repassado' ? 'Repasse registrado.' : 'Bônus recebido.');
    case 'delSub':
      if (!(await ask('Excluir este bônus?', 'Excluir', true))) return;
      await write('delete', 'subsidies', id); closeSheet(); stack = [{tab: 'painel'}]; view = {tab: 'painel', page: 'bonusList'}; render(); return toast('Bônus excluído.');
    case 'taxCsv':
      var rows = [['Vencimento','Plataforma','Conta','Cliente','Faturamento plataforma (US$)','Aluguel cobrado (US$)','Aluguel pago (US$)','Status']];
      allCharges().filter(function (c) { return c.dueDate.slice(0, 4) === v && !c.cancelledAt; }).sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : 1; }).forEach(function (c) {
        var dec = function (x) { return x == null ? '' : (x / 100).toFixed(2); };
        rows.push([c.dueDate, c.platform, c.accountLabel, c.clientName, dec(c.grossCents), dec(c.amountCents), dec(c.paidCents), c.status === 'quitada' ? 'pago' : 'em aberto']);
      });
      var csv = rows.map(function (r) { return r.map(function (x) { x = String(x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(','); }).join('\n');
      try { await navigator.clipboard.writeText(csv); toast('Planilha copiada. Cole no Numbers, Excel ou num e-mail.'); } catch (e) { toast('Este aparelho não deixou copiar.', true); }
      return;
    case 'signOut':
      if (!(await ask('Sair da sua conta neste aparelho?', 'Sair', true))) return;
      closeSheet(); await firebase.auth().signOut(); location.reload(); return;
    case 'backup':
      var data = {app: 'keyring', exportadoEm: nowIso()}; COLS.forEach(function (c) { data[c] = Object.fromEntries(S[c]); });
      try { await navigator.clipboard.writeText(JSON.stringify(data)); toast('Backup copiado.'); } catch (e) { toast('Este aparelho não deixou copiar.', true); }
      return;
  }
}

async function onForm(form) {
  var k = form.getAttribute('data-form'), id = form.getAttribute('data-id'), f = fd2(form);
  switch (k) {
    case 'pay': {
      var ch = get('charges', id); if (!ch || ch.cancelledAt) throw new UErr('Essa cobrança não está mais disponível.');
      var amt = parseMoney(f.amount); if (!(amt > 0)) throw new UErr('Coloque um valor maior que zero.');
      var pid = uid();
      await write('set', 'payments', pid, {chargeId: id, amountCents: amt, paidOn: needDate(f.paidOn || today, 'Data inválida.'), method: f.method || '', note: '', createdAt: nowIso(), updatedAt: null});
      animateRing = view.tab === 'semana' && !view.page; render();
      return paidSheet(id, pid);
    }
    case 'editPay': {
      var a2 = parseMoney(f.amount); if (!(a2 > 0)) throw new UErr('Coloque um valor maior que zero.');
      await write('update', 'payments', id, {amountCents: a2, paidOn: needDate(f.paidOn, 'Data inválida.'), method: (f.method || '').trim(), updatedAt: nowIso()});
      sheet.editPay = null; sheet.dirty = false; paintSheet(); return toast('Pagamento corrigido. Saldo atualizado.');
    }
    case 'gross': {
      var g = (f.gross || '').trim() === '' ? null : parseMoney(f.gross);
      if (g !== null && !(g >= 0)) throw new UErr('Valor inválido.');
      await write('update', 'charges', id, {grossCents: g}); sheet.dirty = false; paintSheet(); return toast(g === null ? 'Faturamento removido.' : 'Faturamento anotado: ' + m(g) + '.');
    }
    case 'promise': {
      var pdt = needDate(f.promiseDate, 'Escolha a data prometida.');
      await write('update', 'charges', id, {promiseDate: pdt, promiseNote: (f.promiseNote || '').trim()}); sheet.dirty = false; paintSheet(); return toast('Promessa anotada para ' + wdm(pdt) + '.');
    }
    case 'cancel': {
      var cid = id; await write('update', 'charges', cid, {cancelledAt: nowIso(), cancelReason: (f.reason || '').trim()}); closeSheet(); return toast('Cobrança cancelada.');
    }
    case 'client': {
      var cl = {name: (f.name || '').trim(), phone: phoneDigits(f.phone), notes: (f.notes || '').trim()};
      if (!cl.name) throw new UErr('Coloque o nome do cliente.');
      if (id) { await write('update', 'clients', id, cl); closeSheet(); return toast('Cliente atualizado.'); }
      var nid = uid(); cl.createdAt = nowIso(); await write('set', 'clients', nid, cl); closeSheet();
      var after = form.getAttribute('data-after');
      if (after) { view.preClient = nid; render(); return toast(first(cl.name) + ' cadastrado. Complete o aluguel.'); }
      go({tab: 'clientes', page: 'cliente', id: nid}); return toast('Cliente cadastrado.');
    }
    case 'account': {
      var acc = {platform: (f.platform || '').trim(), label: (f.label || '').trim().toUpperCase(), region: (f.region || '').trim(), notes: (f.notes || '').trim()};
      if (!acc.platform || !acc.label) throw new UErr('Coloque a plataforma e a identificação.');
      if (id) { await write('update', 'accounts', id, acc); closeSheet(); return toast('Conta atualizada.'); }
      var aid = uid(); acc.paused = false; acc.createdAt = nowIso(); await write('set', 'accounts', aid, acc); closeSheet();
      stack = [{tab: 'contas'}]; view = {tab: 'contas', page: 'conta', id: aid}; render(); window.scrollTo(0, 0); return toast('Conta cadastrada. Agora escolha o cliente.');
    }
    case 'rental': {
      var ac = get('accounts', id); if (!ac) throw new UErr('Conta não encontrada.');
      if (ac.paused) throw new UErr('A conta está pausada.');
      if (activeRental(id)) throw new UErr('Essa conta já está alugada. Encerre o aluguel atual antes.');
      if (!get('clients', f.clientId)) throw new UErr('Escolha o cliente.');
      var wk = parseMoney(f.weekly); if (!(wk > 0)) throw new UErr('Coloque o valor semanal.');
      var fdd = needDate(f.firstDueDate, 'Data da primeira cobrança inválida.'), sd = needDate(f.startDate, 'Data de início inválida.');
      var rid = uid();
      await write('set', 'rentals', rid, {accountId: id, clientId: f.clientId, startDate: sd, dueWeekday: Number(f.dueWeekday), firstDueDate: fdd, endDate: null, rates: [{effectiveDate: fdd, weeklyCents: wk}], createdAt: nowIso()});
      await generate(); view.preClient = null; render(); return toast('Conta alugada. Cobrança gerada.');
    }
    case 'adjust': {
      var rr = get('rentals', id), nw = parseMoney(f.weekly); if (!(nw > 0)) throw new UErr('Coloque o novo valor.');
      var ed = needDate(f.effectiveDate, 'Data inválida.');
      var rates = (rr.rates || []).filter(function (x) { return x.effectiveDate !== ed; }).concat([{effectiveDate: ed, weeklyCents: nw}]);
      await write('update', 'rentals', id, {rates: rates});
      var n = 0;
      if (f.applyOpen === '1') { var tg = list('charges').filter(function (c) { return c.rentalId === id && c.dueDate >= ed && !c.cancelledAt && paidFor(c.id) === 0; }); for (var i = 0; i < tg.length; i++) { await write('update', 'charges', tg[i].id, {amountCents: nw}); n++; } }
      await generate(); closeSheet(); return toast('Novo valor de ' + m(nw) + ' a partir de ' + dm(ed) + '.' + (n ? ' ' + n + ' cobrança(s) atualizada(s).' : ''));
    }
    case 'endRental': {
      var rt = get('rentals', id), end = needDate(f.endDate, 'Data inválida.');
      if (end < rt.startDate) throw new UErr('O último dia não pode ser antes do início.');
      await generate();
      await write('update', 'rentals', id, {endDate: end});
      var del = list('charges').filter(function (c) { return c.rentalId === id && c.dueDate > end && paidFor(c.id) === 0; });
      for (var j = 0; j < del.length; j++) await write('delete', 'charges', del[j].id);
      closeSheet(); render(); return toast('Aluguel encerrado. Pendências preservadas.');
    }
    case 'sub': {
      var pct = Number(String(f.pct || '').replace(',', '.'));
      var sub = {accountId: f.accountId, clientId: f.clientId, periodStart: needDate(f.periodStart, 'Coloque o início do período.'), periodEnd: needDate(f.periodEnd, 'Coloque o fim do período.'),
        receivedCents: (f.received || '').trim() === '' ? 0 : parseMoney(f.received), clientBps: Math.round(pct * 100), status: f.status || 'aguardando',
        receivedOn: f.receivedOn || null, passedOn: f.passedOn || null, notes: (f.notes || '').trim()};
      if (!get('accounts', sub.accountId)) throw new UErr('Escolha a conta.');
      if (!get('clients', sub.clientId)) throw new UErr('Escolha quem recebe a parte.');
      if (sub.periodEnd < sub.periodStart) throw new UErr('O fim do período está antes do início.');
      if (sub.receivedCents == null || sub.receivedCents < 0) throw new UErr('Valor recebido inválido.');
      if (!(sub.clientBps >= 0 && sub.clientBps <= 10000)) throw new UErr('A parte do cliente vai de 0 a 100%.');
      if (sub.status !== 'aguardando' && !sub.receivedCents) throw new UErr('Coloque quanto a plataforma pagou.');
      if (sub.status !== 'aguardando' && !sub.receivedOn) sub.receivedOn = today;
      if (sub.status === 'repassado' && !sub.passedOn) sub.passedOn = today;
      if (id) { sub.createdAt = (get('subsidies', id) || {}).createdAt || nowIso(); await write('set', 'subsidies', id, sub); closeSheet(); return toast('Bônus atualizado.'); }
      var sid = uid(); sub.createdAt = nowIso(); await write('set', 'subsidies', sid, sub); closeSheet();
      go({tab: 'painel', page: 'bonus', id: sid}); return toast('Bônus registrado.');
    }
    case 'restore': {
      var data; try { data = JSON.parse(f.json); } catch (e) { throw new UErr('Esse texto não é um backup válido.'); }
      if (!data || !COLS.every(function (c) { return data[c] && typeof data[c] === 'object'; })) throw new UErr('Esse texto não é um backup deste app.');
      if (!(await ask('Substituir todos os dados pelo backup?', 'Substituir', true))) return;
      for (var ci = 0; ci < COLS.length; ci++) {
        var col = COLS[ci], ids = Array.from(S[col].keys());
        for (var x = 0; x < ids.length; x++) if (!data[col][ids[x]]) await write('delete', col, ids[x]);
        var ks = Object.keys(data[col]);
        for (var y = 0; y < ks.length; y++) await write('set', col, ks[y], data[col][ks[y]]);
      }
      closeSheet(); render(); return toast('Backup restaurado.');
    }
  }
}

function handleErr(e) {
  if (e instanceof UErr) return toast(e.message, true);
  console.error(e);
  if (e && e.code === 'quota_exceeded') return toast('O armazenamento encheu. Faça um backup e peça para arquivar dados antigos.', true);
  if (e && e.code === 'invalid_argument') return toast('Sem permissão para salvar. Abra pelo seu login do claude.ai.', true);
  toast('Não foi possível salvar. Confira a internet e tente de novo.', true);
}

  var t = e.target;

  var pick = t.closest('[data-pick]');

  var chipSel = function (attr, setter) { var b = t.closest('[' + attr + ']'); if (!b) return false; var group = b.parentElement; group.querySelectorAll('[' + attr + ']').forEach(function (x) { x.classList.toggle('on', x === b); }); setter(b.getAttribute(attr), b.closest('form')); if (sheet) sheet.dirty = true; return true; };

  if (chipSel('data-plat', function (v, f) { f.elements.platform.value = v; })) return;
  if (chipSel('data-pct', function (v, f) { f.elements.pct.value = v; f.elements.pct.dispatchEvent(new Event('input', {bubbles: true})); })) return;

});
document.addEventListener('submit', function (e) {
  var f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  var btn = f.querySelector('button:not([type=button])'); if (btn) btn.disabled = true;
  Promise.resolve(onForm(f)).catch(handleErr).finally(function () { if (btn && btn.isConnected) btn.disabled = false; });
});
document.addEventListener('input', function (e) {

});

function listen(requireFresh, timer) {
  var fresh = {}, got = {};
  COLS.forEach(function (col) {
    db.collection(col).onSnapshot(function (snap) {
      var mp = new Map(); snap.docs.forEach(function (d) { if (d.exists) mp.set(d.id, d.data()); });
      S[col] = mp; got[col] = true; if (!snap.metadata.fromCache) fresh[col] = true;
      var okAll = COLS.every(function (c) { return got[c] && (!requireFresh || fresh[c]); });
      if (!ready && okAll) { clearTimeout(timer); boot(); return; }
      if (ready) schedule();
    }, function (e) { console.error(e); got[col] = true; fresh[col] = true; toast('A conexão com os dados caiu. Feche e abra o app.', true); if (!ready && COLS.every(function (c) { return got[c]; })) { clearTimeout(timer); boot(); } });
  });
}
